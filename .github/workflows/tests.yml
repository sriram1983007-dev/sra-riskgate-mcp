name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}, mcp ${{ matrix.mcp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        mcp: ["<2", ">=2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]" "mcp${{ matrix.mcp }}"
      - run: pytest -q tests

  wheel:
    name: built wheel in a clean environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl pytest
          mv src /tmp/src_hidden
          /tmp/clean/bin/python -m pytest -q tests
